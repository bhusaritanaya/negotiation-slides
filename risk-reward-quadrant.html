<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Risk vs Reward Quadrant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#E9E6DC; --paper-2:#F4F2EA;
    --brass:#AD8548; --brass-light:#C9A567;
    --walk:#A24238; --stay:#3F6B52; --caution:#B9862F;
    --ink-soft:#5B6478; --line:#D3CEBD;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);}
  h2{font-family:'Fraunces',serif;margin:0;font-weight:600;letter-spacing:-0.01em;}
  .wrap{max-width:640px;margin:0 auto;padding:40px 24px 56px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--brass);margin-bottom:14px;}
  .kicker-rule{width:36px;height:2px;background:var(--brass);margin-bottom:16px;}
  .slide-title{font-size:clamp(24px,6vw,32px);line-height:1.15;margin-bottom:26px;max-width:22ch;}

  .tool-row{margin-bottom:14px;}
  .tool-row label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .tool-row label .val{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:500;}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--line);border-radius:2px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brass);border:2px solid var(--paper-2);box-shadow:0 0 0 1px var(--brass);cursor:pointer;}

  .quad-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:340px;margin:16px auto 18px;border:1px solid var(--line);}
  .quad-cell{position:absolute;width:50%;height:50%;padding:10px;font-size:11.5px;line-height:1.3;}
  .quad-cell .qt{font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-bottom:2px;}
  .quad-ideal{top:0;left:0;background:#E4ECE5;color:var(--stay);border-right:1px dashed var(--line);border-bottom:1px dashed var(--line);}
  .quad-high{top:0;right:0;background:#F3EAD6;color:#8a6420;border-bottom:1px dashed var(--line);}
  .quad-safe{bottom:0;left:0;background:#E7E9EF;color:#454E68;border-right:1px dashed var(--line);}
  .quad-toxic{bottom:0;right:0;background:#F2E1DF;color:var(--walk);}
  .quad-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--ink);border:3px solid var(--paper-2);box-shadow:0 0 0 1px var(--ink);transform:translate(-50%,-50%);transition:left .12s linear, top .12s linear;z-index:5;}

  .verdict{padding:14px 16px;font-size:14.5px;font-weight:600;line-height:1.4;border-left:4px solid var(--ink-soft);background:var(--paper-2);}
  .verdict.good{border-color:var(--stay);color:var(--stay);}
  .verdict.bad{border-color:var(--walk);color:var(--walk);}
  .verdict.caution{border-color:var(--caution);color:#8a6420;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">try it</div>
  <div class="kicker-rule"></div>
  <h2 class="slide-title">Plot the deal: risk vs. reward</h2>
  <div class="tool-row">
    <label>Risk in this deal <span class="val" id="v-risk">40</span></label>
    <input type="range" id="risk" min="0" max="100" value="40">
  </div>
  <div class="tool-row">
    <label>Reward potential <span class="val" id="v-reward">70</span></label>
    <input type="range" id="reward" min="0" max="100" value="70">
  </div>
  <div class="quad-wrap">
    <div class="quad-cell quad-ideal"><div class="qt">Ideal deal</div>Proceed</div>
    <div class="quad-cell quad-high"><div class="qt">High stakes</div>Confirm the downside first</div>
    <div class="quad-cell quad-safe"><div class="qt">Safe but slow</div>Push for better terms</div>
    <div class="quad-cell quad-toxic"><div class="qt">Toxic deal</div>Walk away</div>
    <div class="quad-dot" id="quadDot"></div>
  </div>
  <div class="verdict" id="quadVerdict">Move the sliders to plot this deal.</div>
</div>

<script>
(function(){
  var risk=document.getElementById('risk'), reward=document.getElementById('reward');
  function updateQuad(){
    var R=+risk.value, W=+reward.value;
    document.getElementById('v-risk').textContent=R;
    document.getElementById('v-reward').textContent=W;
    var dot=document.getElementById('quadDot');
    dot.style.left=R+'%'; dot.style.top=(100-W)+'%';
    var verdict=document.getElementById('quadVerdict');
    var lowRisk=R<50, highReward=W>=50;
    if(lowRisk && highReward){ verdict.className='verdict good'; verdict.textContent='Ideal deal. Strong upside, little to lose — proceed.'; }
    else if(!lowRisk && highReward){ verdict.className='verdict caution'; verdict.textContent='High stakes. Big win possible, but confirm the downside is survivable first.'; }
    else if(lowRisk && !highReward){ verdict.className='verdict caution'; verdict.textContent='Safe but slow. Low risk, low return — negotiate further before accepting.'; }
    else{ verdict.className='verdict bad'; verdict.textContent='Toxic deal. Downside outweighs the upside — walk away.'; }
  }
  [risk,reward].forEach(function(el){ el.addEventListener('input', updateQuad); });
  updateQuad();
})();
</script>
</body>
</html>
